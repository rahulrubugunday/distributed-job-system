apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: job-system:v1
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "src/worker.ts"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret